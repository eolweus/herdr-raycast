# A scoped file: only visible when the Context Directory is inside `scope`.
# Worktree checkouts of the same repo match too.
scope = "/home/you/work/infra"

[[commands]]
id = "tf-plan"
title = "Terraform plan"
description = "Plan the stack in this directory; only offered inside infra/."
keywords = ["terraform"]
run = "terraform plan"
in = "split"

# Hide a Plugin Action or Built-in in this scope.
[[commands]]
id = "persiyanov.reviewr.open"
disabled = true
