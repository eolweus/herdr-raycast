# Copy to $(herdr plugin config-dir erling.command-palette)/commands/ and edit.
# No `scope` means these Commands are visible everywhere.

[[commands]]
id = "lazygit"
title = "Lazygit here"
description = "Open lazygit for the current directory in a popup."
keywords = ["git"]
run = "lazygit"
in = "popup"

[[commands]]
id = "shell-tab"
title = "New shell tab here"
description = "Open a plain shell tab at the current directory with the label you type."
run = ""
in = "tab"
label = "{{input.label}}"

[[commands.inputs]]
name = "label"
prompt = "Tab label"
kind = "text"

[[commands]]
id = "run-in-split"
title = "Run command in split"
description = "Run any shell command in a new split beside the current pane."
run = "{{input.cmd}}"
in = "split"

[[commands.inputs]]
name = "cmd"
prompt = "Command"
kind = "text"

[[commands]]
id = "checkout-branch"
title = "Checkout branch"
description = "Switch the current checkout to a local branch picked from git."
keywords = ["git", "switch"]
run = "git switch {{input.branch}}"
in = "current-pane"

[[commands.inputs]]
name = "branch"
prompt = "Branch"
kind = "choice"
choices_command = "git branch --format=%(refname:short)"

[[commands]]
id = "shell-at-agent"
title = "Shell tab at this agent's directory"
description = "Also offered on agent and pane rows; from the list it uses the agent in the current pane."
on = ["agent", "pane"]
run = ""
in = "tab"
cwd = "{{item.cwd}}"
label = "{{item.label}}"
